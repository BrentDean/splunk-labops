# LabOps Observability — Splunk index storage policy
#
# All sizes are in MB.
# These limits are per-index retention targets, not filesystem quotas.
# Data rolled to frozen is deleted unless an archive is configured.

[default]
maxTotalDataSizeMB = 256
maxDataSize = 128

# Existing Splunk system indexes

[_audit]
maxTotalDataSizeMB = 512

[_configtracker]
maxTotalDataSizeMB = 256

[_dm_summary]
maxTotalDataSizeMB = 512

[_dsappevent]
maxTotalDataSizeMB = 256

[_dsclient]
maxTotalDataSizeMB = 256

[_dsphonehome]
maxTotalDataSizeMB = 256

[_internal]
maxTotalDataSizeMB = 1024

[_introspection]
maxTotalDataSizeMB = 512

[_metrics]
maxTotalDataSizeMB = 512

[_metrics_rollup]
maxTotalDataSizeMB = 256

[_telemetry]
maxTotalDataSizeMB = 256

[_thefishbucket]
maxTotalDataSizeMB = 1024

[history]
maxTotalDataSizeMB = 256

[main]
maxTotalDataSizeMB = 512

[splunklogger]
maxTotalDataSizeMB = 256

[summary]
maxTotalDataSizeMB = 512

# LabOps telemetry indexes

[labops_vps]
homePath = $SPLUNK_DB/labops_vps/db
coldPath = $SPLUNK_DB/labops_vps/colddb
thawedPath = $SPLUNK_DB/labops_vps/thaweddb
maxTotalDataSizeMB = 2048
frozenTimePeriodInSecs = 1209600

[labops_aws]
homePath = $SPLUNK_DB/labops_aws/db
coldPath = $SPLUNK_DB/labops_aws/colddb
thawedPath = $SPLUNK_DB/labops_aws/thaweddb
maxTotalDataSizeMB = 2048
frozenTimePeriodInSecs = 1209600

[labops_local]
homePath = $SPLUNK_DB/labops_local/db
coldPath = $SPLUNK_DB/labops_local/colddb
thawedPath = $SPLUNK_DB/labops_local/thaweddb
maxTotalDataSizeMB = 1024
frozenTimePeriodInSecs = 604800
